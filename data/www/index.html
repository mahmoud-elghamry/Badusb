<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HID Lab Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <div class="logo">HL</div>
                <h1>HID Lab<span class="accent">Panel</span></h1>
            </div>
            <div class="header-right">
                <div class="status-indicator" id="statusDot"></div>
                <span class="status-text" id="statusText">Loading</span>
            </div>
        </header>

        <section class="auth-panel" id="authPanel">
            <div>
                <h2 id="authTitle">Admin Token</h2>
                <p id="authHint">Create or enter the local admin token.</p>
            </div>
            <div class="auth-actions">
                <input type="password" class="input-name" id="adminToken" placeholder="Admin token" autocomplete="current-password">
                <button class="btn btn-primary" id="btnAuth">Unlock</button>
                <button class="btn btn-secondary" id="btnLogout">Forget</button>
            </div>
        </section>

        <div class="content" id="mainContent">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>Payloads</h2>
                    <button class="btn btn-icon" id="btnNew" title="New Payload">+</button>
                </div>
                <div class="payload-list" id="payloadList"></div>
                <div class="storage-info" id="storageInfo"></div>
            </aside>

            <main class="editor-panel">
                <div class="editor-toolbar">
                    <input type="text" class="input-name" id="payloadName" placeholder="payload_name.ducky" maxlength="48">
                    <div class="toolbar-actions">
                        <button class="btn btn-primary" id="btnSave">Save</button>
                        <button class="btn btn-success" id="btnRun">Run</button>
                        <button class="btn btn-danger" id="btnStop" disabled>Stop</button>
                        <button class="btn btn-danger-outline" id="btnDelete">Delete</button>
                    </div>
                </div>
                <textarea class="editor" id="editor" placeholder="REM Enter DuckyScript here...&#10;DELAY 1000&#10;GUI r&#10;DELAY 500&#10;STRING notepad&#10;ENTER" spellcheck="false"></textarea>

                <div class="live-section">
                    <h3>Live Execute</h3>
                    <textarea class="editor editor-live" id="liveEditor" placeholder="Temporary DuckyScript..." spellcheck="false"></textarea>
                    <button class="btn btn-warning" id="btnLive">Execute Live</button>
                </div>
            </main>

            <aside class="settings-panel">
                <h2>Settings</h2>

                <div class="setting-group">
                    <label for="autorunSelect">Auto-Run Payload</label>
                    <div class="inline-control">
                        <select id="autorunSelect">
                            <option value="">None</option>
                        </select>
                        <button class="btn btn-sm" id="btnAutorun">Set</button>
                    </div>
                </div>

                <div class="setting-group">
                    <h3>USB Identity</h3>
                    <div class="dual-input">
                        <input type="text" id="usbVid" class="input-name" placeholder="VID" maxlength="4">
                        <input type="text" id="usbPid" class="input-name" placeholder="PID" maxlength="4">
                    </div>
                    <button class="btn btn-sm btn-full" id="btnSaveUsbId">Save USB ID</button>
                </div>

                <div class="setting-group">
                    <h3>Device Info</h3>
                    <div class="info-row"><span>SSID</span><span id="infoSSID">-</span></div>
                    <div class="info-row"><span>IP</span><span id="infoIP">-</span></div>
                    <div class="info-row"><span>HID</span><span id="infoHID">-</span></div>
                    <div class="info-row"><span>Storage</span><span id="infoStorage">-</span></div>
                    <div class="info-row"><span>Error</span><span id="infoError">-</span></div>
                </div>

                <div class="setting-group">
                    <h3>Quick Payloads</h3>
                    <button class="btn btn-sm btn-full" id="btnTemplate1">Open Notepad</button>
                    <button class="btn btn-sm btn-full" id="btnTemplate2">Open Browser</button>
                    <button class="btn btn-sm btn-full" id="btnTemplate3">Open Terminal</button>
                </div>
            </aside>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
