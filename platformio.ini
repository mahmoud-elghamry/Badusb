; PlatformIO Configuration - ESP32-S3 HID Lab

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Keep the image compatible with the 4 MB partition table used by this project.
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; Native USB HID. USB CDC is disabled so the device enumerates as HID only
; when initUSB() is called in firmware.
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DASYNCWEBSERVER_REGEX

monitor_speed = 115200

lib_deps =
    ESP Async WebServer
    ArduinoJson

lib_ignore =
    AsyncTCP_RP2040W
